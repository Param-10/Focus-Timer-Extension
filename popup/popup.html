<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <h1 id="heading">Focus</h1>
      <button id="settingsButton" class="text-button" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
    </header>

    <section id="timerView" aria-label="Session timer">
      <div class="timer-face">
        <div id="timer" role="timer" aria-label="Time remaining">25:00</div>
        <div class="mode-switch" role="group" aria-label="Session type">
          <button id="focusMode" type="button" aria-pressed="true">Focus</button>
          <button id="breakMode" type="button" aria-pressed="false">Break</button>
        </div>
        <div class="session-meta">
          <p id="stateLabel" class="status" role="status"></p>
          <div id="progressTrack" class="progress-track"><div id="progress"></div></div>
        </div>
      </div>
      <div class="actions">
        <div class="controls">
          <button id="primary" class="primary" type="button" disabled>Start</button>
          <button id="reset" class="ghost" type="button" hidden>End</button>
        </div>
        <p id="footer" class="hint"></p>
      </div>
    </section>

    <section id="settings" hidden aria-labelledby="heading">
      <form id="settingsForm" autocomplete="off">
        <div class="duration-row">
          <label for="focusDuration">Focus</label>
          <div class="duration-input">
            <input id="focusDuration" name="focusDuration" type="number" min="1" max="120" step="1" required value="25" inputmode="numeric">
            <span>min</span>
          </div>
        </div>
        <div class="duration-row">
          <label for="breakDuration">Break</label>
          <div class="duration-input">
            <input id="breakDuration" name="breakDuration" type="number" min="1" max="30" step="1" required value="5" inputmode="numeric">
            <span>min</span>
          </div>
        </div>
        <label class="setting">
          <span>Ping when done</span>
          <input id="soundAlerts" type="checkbox" role="switch">
        </label>
        <label class="setting">
          <span>Auto-start next</span>
          <input id="autoCycle" type="checkbox" role="switch">
        </label>
      </form>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
