<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus settings</title>
  <link rel="stylesheet" href="../popup/popup.css">
</head>
<body class="options-page">
  <main class="app">
    <header>
      <h1 id="settingsTitle">Settings</h1>
    </header>
    <section id="settings" aria-labelledby="settingsTitle">
      <form id="settingsForm" autocomplete="off">
        <div class="duration-row">
          <label for="focusDuration">Focus</label>
          <div class="duration-input">
            <input id="focusDuration" name="focusDuration" type="number" min="1" max="120" step="1" required value="25" inputmode="numeric">
            <span>min</span>
          </div>
        </div>
        <div class="duration-row">
          <label for="breakDuration">Break</label>
          <div class="duration-input">
            <input id="breakDuration" name="breakDuration" type="number" min="1" max="30" step="1" required value="5" inputmode="numeric">
            <span>min</span>
          </div>
        </div>
        <label class="setting">
          <span>Ping when done</span>
          <input id="soundAlerts" type="checkbox" role="switch">
        </label>
        <label class="setting">
          <span>Auto-start next</span>
          <input id="autoCycle" type="checkbox" role="switch">
        </label>
      </form>
      <p id="saved" role="status"></p>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="../popup/popup.js"></script>
</body>
</html>
